name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    name: lint-and-unit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders-service, inventory-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - working-directory: ${{ matrix.service }}
        run: npm ci

      - working-directory: ${{ matrix.service }}
        run: npm run lint

      - working-directory: ${{ matrix.service }}
        run: npm run build

      - working-directory: ${{ matrix.service }}
        run: npm test

  contract-tests:
    name: contract-tests
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Lado consumidor: orders-service genera el contrato Pact contra su
      # propio mock server y lo escribe en orders-service/pacts/.
      - working-directory: orders-service
        run: npm ci

      - working-directory: orders-service
        run: npm run test:pact

      # Lado proveedor: inventory-service levanta el servidor real y verifica
      # que cumple el contrato que orders-service acaba de generar.
      - working-directory: inventory-service
        run: npm ci

      - working-directory: inventory-service
        run: npm run test:pact

  docker-build:
    name: docker-build (${{ matrix.service }})
    needs: [lint-and-unit, contract-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders-service, inventory-service]
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t ${{ matrix.service }}:ci-${{ github.sha }} ./${{ matrix.service }}
