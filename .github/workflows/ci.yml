name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    name: lint-and-unit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders-service, inventory-service]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - working-directory: ${{ matrix.service }}
        run: npm ci

      - working-directory: ${{ matrix.service }}
        run: npm run lint

      - working-directory: ${{ matrix.service }}
        run: npm run build

      - working-directory: ${{ matrix.service }}
        run: npm test

  contract-tests:
    name: contract-tests
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Consumer side: orders-service generates the Pact contract against its
      # own mock server and writes it to orders-service/pacts/.
      - working-directory: orders-service
        run: npm ci

      - working-directory: orders-service
        run: npm run test:pact

      # Provider side: inventory-service starts the real server and verifies
      # that it fulfills the contract orders-service just generated.
      - working-directory: inventory-service
        run: npm ci

      - working-directory: inventory-service
        run: npm run test:pact

  docker-build:
    name: docker-build (${{ matrix.service }})
    needs: [lint-and-unit, contract-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders-service, inventory-service]
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t ${{ matrix.service }}:ci-${{ github.sha }} ./${{ matrix.service }}
