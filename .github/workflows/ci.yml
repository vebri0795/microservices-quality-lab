name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    name: lint-and-unit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders-service, inventory-service]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - working-directory: ${{ matrix.service }}
        run: npm ci

      - working-directory: ${{ matrix.service }}
        run: npm run lint

      - working-directory: ${{ matrix.service }}
        run: npm run build

      - working-directory: ${{ matrix.service }}
        run: npm test

  contract-tests:
    name: contract-tests
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Consumer side: orders-service generates the Pact contract against its
      # own mock server and writes it to orders-service/pacts/.
      - working-directory: orders-service
        run: npm ci

      - working-directory: orders-service
        run: npm run test:pact

      # Provider side: inventory-service starts the real server and verifies
      # that it fulfills the contract orders-service just generated.
      - working-directory: inventory-service
        run: npm ci

      - working-directory: inventory-service
        run: npm run test:pact

  docker-build:
    name: docker-build (${{ matrix.service }})
    needs: [lint-and-unit, contract-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders-service, inventory-service]
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t ${{ matrix.service }}:ci-${{ github.sha }} ./${{ matrix.service }}

  e2e:
    name: e2e
    needs: [lint-and-unit, contract-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: docker compose up --build -d

      # Neither service exposes a health endpoint, so poll for any HTTP
      # response (not a 2xx) to know the port is actually listening.
      - name: Wait for both services to be ready
        run: |
          for port in 4000 4001; do
            for i in $(seq 1 30); do
              curl -s -o /dev/null "http://localhost:$port" && break
              sleep 1
            done
          done

      - working-directory: e2e
        run: npm ci

      - working-directory: e2e
        run: npm test

      - if: always()
        run: docker compose down
